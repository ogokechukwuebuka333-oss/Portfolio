chor="start">To [Estate name] (95%)</text><text x="354" y="462" font-size="14" font-weight="600" fill="#1F1F1F" text-anchor="end">₦ [00,000]</text><text x="36" y="488" font-size="14" font-weight="400" fill="#1F1F1F" text-anchor="start">MyEstates platform fee (5%)</text><text x="354" y="488" font-size="14" font-weight="600" fill="#1F1F1F" text-anchor="end">₦ [0,000]</text><text x="36" y="508" font-size="11" font-weight="400" fill="#636363" text-anchor="start">Includes Paystack&#x27;s gateway fee. No extra charge to you.</text><line x1="36" y1="522" x2="354" y2="522" stroke="#D6D6D6" stroke-width="1"/><text x="36" y="548" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="start">Total paid</text><text x="354" y="548" font-size="15" font-weight="700" fill="#1F1F1F" text-anchor="end">₦ [00,000]</text><text x="195" y="600" font-size="13" font-weight="400" fill="#636363" text-anchor="middle">Your chairman and treasurer see this payment</text><text x="195" y="618" font-size="13" font-weight="400" fill="#636363" text-anchor="middle">automatically — no need to send proof.</text><rect x="20" y="680" width="350" height="52" rx="10" fill="#2B2B2B"/><text x="195.0" y="712.0" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Back to home</text><rect x="20" y="744" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#2B2B2B" stroke-width="1.5"/><text x="195.0" y="776.0" font-size="16" font-weight="600" fill="#1F1F1F" text-anchor="middle">View payment record</text></svg>