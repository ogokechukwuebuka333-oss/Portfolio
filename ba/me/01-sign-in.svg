<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="01 Sign in wireframe" font-family="'IBM Plex Sans', 'Helvetica Neue', sans-serif" style="display:block"><rect width="390" height="844" fill="#FFFFFF"/><rect x="20" y="96" width="48" height="48" rx="12" fill="#D9D9D9"/><text x="80" y="128" font-size="20" font-weight="700" fill="#1F1F1F" text-anchor="start">MyEstates</text><text x="20" y="220" font-size="28" font-weight="700" fill="#1F1F1F" text-anchor="start">Sign in</text><text x="20" y="252" font-size="15" font-weight="400" fill="#636363" text-anchor="start">Enter the phone number your estate</text><text x="20" y="274" font-size="15" font-weight="400" fill="#636363" text-anchor="start">has on file. We&#x27;ll text you a code.</text><text x="20" y="320" font-size="13" font-weight="500" fill="#1F1F1F" text-anchor="start">Phone number</text><rect x="20" y="330" width="350" height="52" rx="10" fill="#FFFFFF" stroke="#BDBDBD" stroke-width="1"/><line x1="100" y1="338" x2="100" y2="374" stroke="#BDBDBD" stroke-width="1"/><text x="36" y="362" font-size="15" font-weight="500" fill="#1F1F1F" text-anchor="start">+234</text><polyline points="78,352 83,357 88,352" fill="none" stroke="#636363" stroke-width="1.5"/><text x="116" y="362" font-size="15" font-weight="400" fill="#8A8A8A" text-anchor="start">[800 000 0000]</text><rect x="20" y="410" width="350" height="52" rx="10" fill="#2B2B2B"/><text x="195.0" y="442.0" font-size="16" font-weight="600" fill="#FFFFFF" text-anchor="middle">Send code</text><text x="195" y="494" font-size="12" font-weight="400" fill="#636363" text-anchor="middle">No password needed — a fresh code every time.</text><rect x="20" y="660" width="350" height="96" rx="12" fill="#F2F2F2"/><text x="36" y="692" font-size="14" font-weight="600" fill="#1F1F1F" text-anchor="start">New here?</text><text x="36" y="714" font-size="13" font-weight="400" fill="#636363" text-anchor="start">You don&#x27;t sign up yourself — your estate&#x27;s</text><text x="36" y="732" font-size="13" font-weight="400" fill="#636363" text-anchor="start">chairman or secretary adds you.</text></svg>